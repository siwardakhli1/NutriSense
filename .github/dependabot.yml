# ==========================================
# DEPENDABOT - Surveillance des dépendances NutriSense
# ==========================================
# Trois périmètres distincts sont surveillés :
#   1. Backend  (API Express / Node 20)      -> /backend/package.json
#   2. Frontend (React Native / Expo SDK 52) -> /package.json
#   3. Pipeline CI (actions GitHub)          -> /.github/workflows/
#
# Politique retenue :
#   - Patch et mineure : regroupées dans une seule PR automatique par périmètre,
#     fusionnées après validation de la CI (build + 279 tests + audit + Docker).
#   - Majeure : PR individuelle, traitement manuel sur branche dédiée.
#   - Écosystème Expo / React Native : majeures exclues des mises à jour npm.
#     Ces paquets sont versionnés de façon solidaire avec le SDK Expo et se
#     mettent à jour via `expo upgrade`, qui aligne aussi la couche native
#     (Android / iOS). Une montée de version majeure par npm désynchroniserait
#     le JavaScript et le natif, et casserait le build.

version: 2

updates:
  # ==========================================
  # 1. BACKEND - API Express (Node 20)
  # ==========================================
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      backend-patch-minor:
        update-types:
          - "patch"
          - "minor"

  # ==========================================
  # 2. FRONTEND - React Native / Expo SDK 52
  # ==========================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      frontend-patch-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # --- Coeur React ---
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

      # --- Ecosysteme Expo (expo, expo-font, expo-router, expo-haptics, ...) ---
      # Versionnes de facon solidaire avec le SDK : `expo upgrade` uniquement.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]

      # --- Ecosysteme React Native ---
      # Couvre react-native et les modules communautaires
      # (@react-native-community/slider, @react-native-async-storage/...)
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major"]

  # ==========================================
  # 3. PIPELINE CI - Actions GitHub
  # ==========================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"